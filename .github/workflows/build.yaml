on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/*.yaml'
      - '.github/actions/*/action.yaml'
      - 'ergogen/**'
      - 'kibot/**'
      - 'freerouting/*'
      - 'build.sh'
      - 'package*.json'

name: Build
jobs:
  board:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [corney_island, corney_island_wireless]
    name: Generate ${{ matrix.board }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check export and batch behavior
        run: python3 -m unittest discover -s kibot/tests -v
      - name: Generate, route, and validate using KiCad 9
        # Temporarily keep neckdown and fanout disabled while routing completion is investigated.
        # Fanout is disabled in build.sh; pin neckdown here as well as its local default.
        env:
          FREEROUTING_NECKDOWN: 'false'
          ERGOGEN_DOCKER_IMAGE: ceoloide/ergogen-freerouting:dev
        run: ./build.sh "${{ matrix.board }}"
      # Match exact board stems: corney_island* also matches the wireless board.
      - name: Persist ${{ matrix.board }} and its unfiltered DRC reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}
          path: |
            gerbers/${{ matrix.board }}.zip
            gerbers/${{ matrix.board }}_autorouted.zip
            gerbers/${{ matrix.board }}_manually_routed.zip
            images/${{ matrix.board }}-*.png
            images/${{ matrix.board }}_autorouted-*.png
            images/${{ matrix.board }}_manually_routed-*.png
            pcbs/${{ matrix.board }}.*
            pcbs/${{ matrix.board }}_autorouted.*
            pcbs/${{ matrix.board }}_manually_routed.*
            reports/routing/${{ matrix.board }}-*.json
            !pcbs/*-bak

      # Every matrix job generates shared plates. The first job uploads them once.
      - name: Persist backplate
        if: always() && strategy.job-index == 0
        uses: actions/upload-artifact@v7
        with:
          name: backplate
          path: |
            gerbers/backplate.zip
            images/backplate-*.png
            outlines/backplate.*
            pcbs/backplate.kicad_*
            reports/routing/backplate.json
            !pcbs/*-bak

      - name: Persist frontplate
        if: always() && strategy.job-index == 0
        uses: actions/upload-artifact@v7
        with:
          name: frontplate
          path: |
            gerbers/frontplate.zip
            images/frontplate-*.png
            outlines/frontplate.*
            pcbs/frontplate.kicad_*
            reports/routing/frontplate.json
            !pcbs/*-bak

      - name: Persist controller_overlay
        if: always() && strategy.job-index == 0
        uses: actions/upload-artifact@v7
        with:
          name: controller_overlay
          path: |
            gerbers/controller_overlay.zip
            images/controller_overlay-*.png
            outlines/controller_overlay.*
            pcbs/controller_overlay.kicad_*
            reports/routing/controller_overlay.json
            !pcbs/*-bak

      - name: Persist shared case and outline geometry
        if: always() && strategy.job-index == 0
        uses: actions/upload-artifact@v7
        with:
          name: case-and-outlines
          path: |
            cases
            outlines/pcb.*
            outlines/preview.*
