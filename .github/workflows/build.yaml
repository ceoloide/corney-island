on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/*.yaml'
      - '.github/actions/*/action.yaml'
      - 'ergogen/**'
      - 'kibot/**'
      - 'freerouting/*'
      - 'build.sh'
      - 'package*.json'

name: Build
jobs:
  board:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [corney_island, corney_island_wireless]
    name: Generate ${{ matrix.board }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Read pinned Freerouting revision
        id: router
        run: python3 -c 'import json; print("revision=" + json.load(open("freerouting/build.json"))["revision"])' >> "$GITHUB_OUTPUT"
      - name: Checkout Freerouting
        uses: actions/checkout@v7
        with:
          repository: freerouting/freerouting
          ref: ${{ steps.router.outputs.revision }}
          path: .freerouting-build
      - name: Use Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build pinned Freerouting snapshot
        working-directory: .freerouting-build
        run: ./gradlew executableJar
      - name: Install routing JAR
        run: cp .freerouting-build/build/libs/freerouting-current-executable.jar freerouting/
      - name: Check export and batch behavior
        run: python3 -m unittest discover -s kibot/tests -v
      - name: Generate, route, and validate using KiCad 9
        run: ./build.sh "${{ matrix.board }}"
      - name: Persist output and unfiltered DRC reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}
          path: |
            cases
            gerbers
            images
            outlines
            pcbs
            reports/routing
